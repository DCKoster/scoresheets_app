name = "scoresheets-local"
main = "worker/index.js"
compatibility_date = "2026-11-04"
workers_dev = false

[assets]
directory = "./web_app"
binding = "ASSETS"
run_worker_first = ["/api", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "scoresheets-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[env.preview]
name = "scoresheets-preview"
workers_dev = true
preview_urls = false
compatibility_date = "2026-11-04"

[env.preview.observability]
enabled = true

[env.preview.observability.logs]
invocation_logs = true

[[env.preview.d1_databases]]
binding = "DB"
database_name = "scoresheets-preview"
database_id = "c8ca95a8-97b6-4432-9d18-9b99fd657de3"
migrations_dir = "migrations"

[env.production]
name = "scoresheets"
workers_dev = true
compatibility_date = "2026-11-04"
routes = [{ pattern = "scoresheet.dckoster.com", custom_domain = true }]
preview_urls = false

[env.production.observability]
enabled = true

[env.production.observability.logs]
invocation_logs = false

[[env.production.d1_databases]]
binding = "DB"
database_name = "scoresheets-production"
database_id = "de0499c0-6140-4b57-993d-8fc1b0140f7e"
migrations_dir = "migrations"
