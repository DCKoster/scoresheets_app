<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoresheets Web</title>
    <meta name="theme-color" content="#18211e" />
    <meta name="description" content="Simple offline score tracking for board and card games." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div>
          <h1>Scoresheets</h1>
        </div>
        <button id="language" class="language-toggle" type="button" aria-label="Switch to Dutch">🇬🇧 EN</button>
      </header>

      <section class="card cloud-panel" aria-label="Groups" data-i18n-aria-label="cloud.groups">
        <div class="cloud-controls">
          <span id="group-account"></span>
          <label id="group-choice-label" for="group-choice" class="visually-hidden" data-i18n="cloud.groups">Groups</label>
          <select id="group-choice" class="hidden"></select>
          <button id="group-show-login" class="secondary" type="button" data-i18n="cloud.signIn">Sign in</button>
          <button id="group-admin-toggle" class="secondary hidden" type="button" aria-expanded="false" aria-controls="group-admin" data-i18n="cloud.manage">Manage groups</button>
          <button id="group-refresh" class="secondary hidden" type="button" data-i18n="cloud.syncNow">Sync now</button>
          <button id="group-sign-out" class="secondary hidden" type="button" data-i18n="cloud.signOut">Sign out</button>
        </div>
        <p id="group-status" role="status"></p>
        <details id="group-pending" class="hidden"></details>
        <form id="group-login" class="hidden">
          <label for="group-username" data-i18n="cloud.username">Username</label>
          <input id="group-username" name="username" maxlength="80" autocomplete="username" autocapitalize="none" spellcheck="false" required />
          <label for="group-code" data-i18n="cloud.loginCode">Login code</label>
          <input id="group-code" name="code" type="password" maxlength="32" autocomplete="current-password" required />
          <div class="button-row">
            <button type="submit" data-i18n="cloud.signIn">Sign in</button>
            <button id="group-cancel-login" class="secondary" type="button" data-i18n="games.cancel">Cancel</button>
          </div>
        </form>
        <div id="group-issued" class="hidden">
          <label for="group-issued-code" data-i18n="cloud.shareCode">Copy this login code now and share it privately with the username.</label>
          <p id="group-issued-username"></p>
          <input id="group-issued-code" readonly autocomplete="off" spellcheck="false" />
          <button id="group-dismiss-code" class="secondary" type="button" data-i18n="cloud.dismissCode">Hide code</button>
        </div>
        <div id="group-admin" class="hidden">
          <form id="group-create">
            <label for="group-name" data-i18n="cloud.groupName">Group name</label>
            <input id="group-name" name="name" maxlength="100" required />
            <button type="submit" data-i18n="cloud.createGroup">Create group</button>
          </form>
          <form id="group-members-form" class="hidden">
            <label for="member-username" data-i18n="cloud.username">Username</label>
            <input id="member-username" name="username" maxlength="80" pattern="[A-Za-z0-9][A-Za-z0-9_.\-]{0,79}" autocapitalize="none" spellcheck="false" required />
            <label for="member-name" data-i18n="cloud.newMemberName">Display name for new accounts</label>
            <input id="member-name" name="name" maxlength="100" />
            <label for="member-email" data-i18n="cloud.optionalEmail">Email (optional)</label>
            <input id="member-email" name="email" type="email" maxlength="254" />
            <button type="submit" data-i18n="cloud.addMember">Add member</button>
          </form>
          <ul id="group-members"></ul>
        </div>
      </section>

      <nav class="tabs" aria-label="Main views" data-i18n-aria-label="nav.label">
        <button class="tab is-active" data-view="home" data-i18n="nav.home" type="button">Home</button>
        <button class="tab" data-view="new-session" data-i18n="nav.newSession" type="button">New Session</button>
        <button class="tab" data-view="history" data-i18n="nav.history" type="button">Session History</button>
        <button class="tab" data-view="statistics" data-i18n="nav.statistics" type="button">Statistics</button>
        <button class="tab" data-view="games" data-i18n="nav.games" type="button">Manage Games</button>
      </nav>

      <section class="view" id="view-home">
        <section class="card">
          <h2 data-i18n="home.title">Home</h2>
          <p data-i18n="home.intro">Track scores for point-based games.</p>
          <div id="home-summary"></div>
        </section>
      </section>

      <section class="view hidden" id="view-new-session">
        <section class="card" id="new-session-card">
          <h2 data-i18n="session.new">New Session</h2>
          <label for="game" data-i18n="session.game">Game</label>
          <select id="game"></select>

          <label id="players-label" for="players" data-i18n="session.players">Players (comma separated)</label>
          <input id="players" type="text" list="player-suggestions" placeholder="Daniel, Illy" />
          <datalist id="player-suggestions"></datalist>
          <datalist id="group-guest-suggestions"></datalist>

          <div id="group-players" class="hidden"></div>
          <button id="start-session" data-i18n="session.start" type="button">Start session</button>
        </section>

        <section class="card hidden" id="session-panel">
          <h2 id="session-title"></h2>
          <div id="session-player-editor" class="hidden"><label for="session-players" data-i18n="session.players">Players (comma separated)</label><input id="session-players" type="text" /></div>
          <div id="group-edit-players" class="hidden"></div>
          <div id="entry-panel"></div>
          <div class="button-row"><button id="save-session" class="accent" data-i18n="session.save" type="button">Save session</button><button id="cancel-session" class="secondary" data-i18n="session.cancel" type="button">Cancel session</button><button id="cancel-session-edit" class="secondary hidden" data-i18n="session.cancelEdit" type="button">Cancel</button></div>
        </section>
      </section>

      <section class="view hidden" id="view-history">
        <section class="card">
          <h2 data-i18n="session.savedTitle">Saved Sessions</h2>
          <div id="saved-list"></div>
        </section>
      </section>

      <section class="view hidden" id="view-statistics">
        <section class="card">
          <h2 data-i18n="statistics.title">Statistics</h2>
          <div id="statistics"></div>
        </section>
      </section>

      <section class="view hidden" id="view-games">
        <section class="card">
          <h2 data-i18n="games.title">Manage Games</h2>
          <button id="add-game" class="add-game" data-i18n="games.add" type="button">Add game</button>
          <form id="game-form" class="hidden">
            <input id="editing-game-id" type="hidden" />
            <label for="game-name" data-i18n="games.name">Game name</label>
            <input id="game-name" type="text" required />
            <label for="play-mode" data-i18n="games.playMode">Play mode</label>
            <select id="play-mode"><option value="competitive" data-i18n="games.playMode.competitive">Competitive</option><option value="cooperative" data-i18n="games.playMode.cooperative">Cooperative</option></select>
            <fieldset id="score-categories-fieldset"><legend data-i18n="games.scoreCategories">Score categories</legend><div id="score-categories"></div><button id="add-score-category" class="secondary" data-i18n="games.addScoreCategory" type="button">Add score category</button><label for="category-scoring" data-i18n="games.categoryScoring">Category entry</label><select id="category-scoring"><option value="per-round" data-i18n="games.perRound">Per round</option><option value="final-total" data-i18n="games.finalCategoryTotal">Final totals</option></select></fieldset>
            <label for="entry-mode" data-i18n="games.entryMode">Entry mode</label>
            <select id="entry-mode"><option value="round-sum" data-i18n="games.engine.round-sum">Scores by round</option><option value="final-total" data-i18n="games.engine.final-total">One final total</option><option value="winner-only" data-i18n="games.engine.winner-only">Winner only</option></select>
            <label id="ranking-label" for="ranking" data-i18n="games.ranking">Ranking objective</label>
            <select id="ranking"><option value="highest" data-i18n="games.ranking.highest">Highest wins</option><option value="lowest" data-i18n="games.ranking.lowest">Lowest wins</option></select>
            <div class="button-row"><button id="save-game" data-i18n="games.create" type="submit">Create game</button><button id="cancel-game-edit" class="secondary hidden" data-i18n="games.cancel" type="button">Cancel</button></div>
          </form>
          <div class="game-filters"><label class="visually-hidden" for="game-search" data-i18n="games.search">Search games</label><input id="game-search" type="search" placeholder="Search games" /></div>
          <div id="games-list"></div>
        </section>
      </section>
      <p id="app-error" class="error hidden" role="alert"></p>
    </main>

    <script type="module" src="./src/main.js"></script>
    <script src="https://dckoster.com/lemur/dk-home-lemur.js" defer></script>
  </body>
</html>
